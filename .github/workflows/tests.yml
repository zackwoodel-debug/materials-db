name: tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Read the pinned refractiveindex.info commit
        id: ri
        run: echo "sha=$(tr -d '[:space:]' < refractiveindex_commit.txt)" >> "$GITHUB_OUTPUT"

      # The RI.info database is not committed (gitignored); every build and test reads it at this exact commit.
      - uses: actions/checkout@v4
        with:
          repository: polyanskiy/refractiveindex.info-database
          ref: ${{ steps.ri.outputs.sha }}
          path: refractiveindex_db

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - run: pip install -r requirements-test.txt

      - run: python -m pytest tests -q
